name: Controlled real-model evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secondhand-real-model
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: model-evaluation
    timeout-minutes: 180
    env:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      GRAPH_LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m scripts.bootstrap_p6
        working-directory: backend
      - run: docker compose up -d --wait mysql checkpoint
      - run: python -m scripts.run_p5_evaluation --allow-real-model --output ../artifacts/model-evaluation --repetitions 3 --concurrency 4 --trace-local
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-${{ github.sha }}
          # Only sanitized result/trace evidence. Never upload deployment.env or DB dumps.
          path: |
            artifacts/model-evaluation/report.json
            artifacts/model-evaluation/native-traces.jsonl
      - run: docker compose down
        if: always()
