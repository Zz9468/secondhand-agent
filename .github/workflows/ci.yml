name: P6 deterministic and database gates
on:
  pull_request:
  push:
    branches: [main, refactor/langgraph, 'codex/**']
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip check
      - run: python -m pip_audit -r backend/requirements.lock --no-deps --disable-pip
      - run: python -m scripts.bootstrap_p6
        working-directory: backend
      - run: python -m ruff check app evaluation tests scripts migrations
        working-directory: backend
      - run: python -m pytest tests/unit tests/test_health.py tests/test_model_contract.py --junitxml=../artifacts/unit.xml
        working-directory: backend
      - run: npm ci && npm run build && npm audit --omit=dev --registry=https://registry.npmjs.org
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-${{ github.sha }}
          path: artifacts/*.xml
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m scripts.bootstrap_p6
        working-directory: backend
      - run: docker compose up -d --wait mysql checkpoint
      - run: python -m scripts.run_p0_tests tests/p0 tests/graph --junitxml=../artifacts/protocol.xml
        working-directory: backend
      - run: python -m scripts.run_isolated_mysql_tests tests/unit tests/integration tests/test_health.py tests/test_model_contract.py --junitxml=../artifacts/business.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: databases-${{ github.sha }}
          path: artifacts/*.xml
      - run: docker compose down
        if: always()
