[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secondhand-agent-backend"
version = "0.1.0"
description = "SecondHand Agent FastAPI backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.2.0",
    "langsmith>=0.14,<1.0",
    "openai>=3.19,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pymysql>=1.1,<2.0",
    "psycopg[binary,pool]==3.3.6",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "agentevals==0.0.9",
    "httpx>=0.27,<1.0",
    "pip-audit>=2.9,<3.0",
    "openevals==0.2.2",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.setuptools.package-data]
app = ["agent/prompt_resources/*.txt"]
evaluation = ["scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "mysql_integration: 需要本地 MySQL 的集成测试",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
